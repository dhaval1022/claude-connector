{% extends "base.html" %}
{% block title %}Sign in – Medkart Data Connector{% endblock %}
{% block body %}
<div style="max-width:380px;margin:8vh auto">
  <div style="text-align:center;margin-bottom:24px">
    <div style="width:48px;height:48px;border-radius:12px;background:var(--primary-gradient);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 4px 12px rgba(5, 150, 105, 0.3);margin-bottom:12px">M</div>
    <h2 style="margin:0 0 6px;font-size:24px">Sign in</h2>
    <p class="muted" style="margin:0">Access your Medkart Data Connector workspace</p>
  </div>

  <div class="card" style="padding:28px">
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label style="font-size:12px;font-weight:600;color:#475569">Email Address</label>
      <input name="email" type="email" placeholder="you@medkart.in" required autofocus style="margin-bottom:14px">
      
      <label style="font-size:12px;font-weight:600;color:#475569">Password</label>
      <input name="password" type="password" placeholder="••••••••••••" required style="margin-bottom:20px">
      
      <button style="width:100%;padding:10px;font-size:14px;font-weight:600">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
