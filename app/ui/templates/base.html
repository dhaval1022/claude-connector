<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Medkart Data Connector{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --input-border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #059669;
      --primary-hover: #047857;
      --primary-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
      --accent: #4f46e5;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --success-text: #065f46;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-card: 0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.06);
      --shadow-hover: 0 6px 12px -2px rgb(0 0 0 / 0.08), 0 3px 6px -3px rgb(0 0 0 / 0.08);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* Header & Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 2px 4px rgba(5, 150, 105, 0.25);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      transition: all 0.15s ease;
    }

    nav a:hover {
      color: var(--text);
      background: #f1f5f9;
    }

    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #f1f5f9;
      border-radius: 20px;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      margin: 0 4px;
    }

    .user-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    /* Main Container */
    main {
      max-width: 920px;
      margin: 32px auto;
      padding: 0 20px 48px;
    }

    h1, h2, h3, h4 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      margin-top: 0;
      letter-spacing: -0.02em;
    }

    h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }

    p { margin: 6px 0 14px; }
    .muted { color: var(--text-muted); font-size: 13px; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-card);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      border-color: var(--border-hover);
    }

    /* Buttons */
    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid transparent;
      background: var(--primary-gradient);
      color: #fff;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    button:hover, .btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    button:active, .btn:active {
      transform: translateY(0);
    }

    .btn-secondary, button.btn-secondary {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover, button.btn-secondary:hover {
      background: #f8fafc;
      border-color: var(--border-hover);
      filter: none;
    }

    .btn-danger, button.btn-danger {
      background: #fff;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .btn-danger:hover, button.btn-danger:hover {
      background: var(--danger-bg);
      border-color: #fca5a5;
      filter: none;
    }

    form.inline { display: inline-block; margin: 0; }

    /* Inputs & Form Controls */
    input, select, textarea {
      font-family: inherit;
      font-size: 14px;
      padding: 9px 12px;
      margin: 6px 0;
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:not([type="checkbox"]):not([type="radio"]), select, textarea {
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    input[readonly] {
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
    }

    /* Badges & Tags */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-radius: 12px;
      background: #f1f5f9;
      color: #475569;
    }

    .badge-green { background: #ecfdf5; color: #059669; }
    .badge-blue { background: #eff6ff; color: #2563eb; }
    .badge-amber { background: #fffbeb; color: #d97706; }
    .badge-purple { background: #faf5ff; color: #7e22ce; }

    /* Alerts */
    .ok, .err {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ok {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
      word-break: break-all;
    }

    .err {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      margin: 8px 0;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin: 16px 0;
      box-shadow: var(--shadow-sm);
    }

    th {
      background: #f8fafc;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <header>
    <a href="/sources" class="brand">
      <div class="brand-logo">M</div>
      <span>Medkart Data Connector</span>
    </a>
    {% if ctx %}
    <nav>
      <a href="/sources">Data sources</a>
      {% if ctx.user.role == "admin" %}
      <a href="/admin/users">Users</a>
      <a href="/admin/audit">Audit</a>
      {% endif %}
      <a href="/account/connect">Connect</a>
      <a href="/account/tokens">API tokens</a>
      <a href="/account/password">Password</a>
      <span class="user-pill"><span class="user-dot"></span>{{ ctx.user.email }}</span>
      <form class="inline" method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ ctx.csrf }}">
        <button class="btn-secondary" style="padding:4px 10px;font-size:12px">Sign out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
