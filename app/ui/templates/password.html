{% extends "base.html" %}
{% block title %}Change Password – Medkart Data Connector{% endblock %}
{% block body %}
<div style="max-width:440px;margin:20px auto">
  <div style="margin-bottom:20px">
    <h2>Change Password</h2>
    <p class="muted">Update your account credentials. Must be at least 10 characters long.</p>
  </div>

  {% if notice %}<div class="ok">{{ notice }}</div>{% endif %}
  {% if error %}<div class="err">{{ error }}</div>{% endif %}

  <div class="card" style="padding:26px">
    <form method="post" action="/account/password" style="margin:0">
      <input type="hidden" name="csrf" value="{{ ctx.csrf }}">
      
      <label style="font-size:12px;font-weight:600;color:#475569">Current Password</label>
      <input name="current" type="password" placeholder="••••••••••••" required style="margin-bottom:14px">
      
      <label style="font-size:12px;font-weight:600;color:#475569">New Password</label>
      <input name="new" type="password" placeholder="At least 10 characters" required style="margin-bottom:20px">
      
      <button style="width:100%;padding:10px">Save password</button>
    </form>
  </div>
</div>
{% endblock %}
