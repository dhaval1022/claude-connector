{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:420px">
  <h2>Change password</h2>
  {% if ctx.user.must_change_password %}
    <p class="muted">You must set a new password before continuing.</p>{% endif %}
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf" value="{{ ctx.csrf }}">
    <input name="current" type="password" placeholder="Current password" required>
    <input name="new" type="password" placeholder="New password (min 10 characters)" required>
    <button>Update password</button>
  </form>
</div>
{% endblock %}
