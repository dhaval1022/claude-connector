# nginx alternative to Caddy (TLS certificates managed separately, e.g. certbot).
server {
    listen 443 ssl http2;
    server_name connector.example.com;
    ssl_certificate     /etc/letsencrypt/live/connector.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connector.example.com/privkey.pem;

    client_max_body_size 150m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client input
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;            # streamable-HTTP MCP responses
        proxy_read_timeout 900s;
    }
}
server {
    listen 80;
    server_name connector.example.com;
    return 301 https://$host$request_uri;
}
